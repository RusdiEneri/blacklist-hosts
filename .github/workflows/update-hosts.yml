name: Update Hosts Registry

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-hosts.yml'
      - 'sources.list' # Otomatis trigger jika sources.list diedit

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: fals

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Cegah job menggantung selamanya jika server sumber down

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Sources
        run: |
          set -Eeuo pipefail
          
          rm -rf hosts
          mkdir -p hosts
          
          if [ ! -f sources.list ]; then
            echo "ERROR: sources.list not found"
            exit 1
          fi
          echo "Using sources.list from repository"

      - name: Fetch Sources
        run: |
          set -Eeuo pipefail

          while read -r path url || [[ -n "$path" ]]; do
            path="${path%$'\r'}"
            url="${url%$'\r'}"

            [[ -z "$path" ]] && continue
            [[ "$path" =~ ^# ]] && continue

            dest="hosts/${path}.txt"
            mkdir -p "$(dirname "$dest")"

            echo "Downloading $path dari $url"

            # --compressed: Mempercepat download file teks besar (OISD/StevenBlack) via gzip
            # max-time 600: Memberi waktu 10 menit untuk file berukuran puluhan MB
            if curl -fsSL \
              --compressed \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 20 \
              --max-time 600 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -o "$dest.tmp" \
              "$url"; then
              mv "$dest.tmp" "$dest"
            else
              echo "Download failed: $url"
              rm -f "$dest.tmp"
            fi

          done < sources.list

      - name: Generate README
        run: |
          set -Eeuo pipefail

          REPO="${{ github.repository }}"
          RAW_GITHUB="https://raw.githubusercontent.com/${REPO}/main"
          JSDELIVR="https://cdn.jsdelivr.net/gh/${REPO}@main"
          RAWGITHACK="https://raw.githack.com/${REPO}/main"

          cat << 'EOF' > README.md
          # 🛡️ DNS Blocklist Registry
          
          Koleksi daftar hitam domain (hosts/blocklist) terkurasi. Repositori ini menyediakan berbagai daftar dari **HaGeZi, OISD, dan Steven Black** yang siap digunakan untuk aplikasi seperti AdGuard Home, Pi-hole, NextDNS, atau uBlock Origin.
          
          ## 📖 Panduan Memilih Blocklist (Untuk Pemula)
          
          Bingung harus pakai yang mana? Ikuti panduan singkat berikut agar tidak salah pilih:
          
          ### 1. Pilih **SATU** Level Utama (Sebagai Dasar)
          Pilih salah satu dari daftar ini sesuai dengan spesifikasi router/perangkat Anda. Jangan gunakan semuanya sekaligus!
          - **Light / OISD Small:** Sangat ringan. Hanya memblokir iklan dan pelacak dasar. Cocok untuk router tua atau HP spesifikasi rendah.
          - **Multi / OISD Big:** **(Rekomendasi)** Kombinasi berbagai sumber. Pemblokiran seimbang, sangat cocok untuk penggunaan internet harian di rumah.
          - **Pro / Pro Plus:** Lebih agresif dari Multi. Memblokir iklan, pelacak, dan malware secara lebih mendalam.
          - **Ultimate:** Tingkat pemblokiran tertinggi (sangat ketat). Memblokir hampir semua yang mencurigakan. *Catatan: Terkadang bisa memblokir situs resmi, butuh whitelist manual.*
          
          ### 2. Tambahkan Kategori Khusus (Opsional)
          Gabungkan dengan level utama di atas jika Anda butuh filter spesifik:
          - **NSFW / OISD NSFW:** Memblokir situs dewasa/pornografi. (Sangat disarankan untuk jaringan keluarga/anak-anak).
          - **Gambling:** Memblokir situs judi online.
          - **Social:** Memblokir akses ke media sosial (Facebook, TikTok, Instagram, dll).
          - **Popupads / Fake:** Memblokir iklan pop-up yang mengganggu dan situs penipuan.
          
          ### 3. Blokir Pelacakan Bawaan HP (Native)
          Ingin HP tidak boros baterai karena diam-diam mengirim data ke pabrikan? Gunakan list ini sesuai merk HP/OS Anda:
          - `native.xiaomi`, `native.samsung`, `native.oppo-realme`, `native.vivo`, `native.huawei`, `native.apple`, `native.winoffice`.
          
          ### 4. Keamanan & Anti-Bypass (Tingkat Lanjut)
          - **TIF (Threat Intelligence):** Memblokir situs berbahaya, malware, dan phishing terbaru.
          - **DoH / VPN-Proxy-Bypass:** Mencegah pengguna di jaringan Anda mengakali blokir DNS menggunakan VPN atau DNS-over-HTTPS.
          
          ---
          
          ## 📊 Statistik & Link Unduh
          
          > 💡 **Tips:** Gunakan kolom **RawGitHack** atau **jsDelivr** untuk ditempel ke aplikasi pemblokir DNS Anda. Hindari kolom `GitHub Raw` untuk penggunaan jangka panjang karena memiliki batas *rate-limit* yang sering menyebabkan update gagal.
          
          | File | RawGitHack | jsDelivr | GitHub Raw | Jumlah Domain | Terakhir Diupdate |
          |------|------------|----------|------------|---------------|-------------------|
          EOF

          total=0
          current_time=$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')

          while IFS= read -r file; do
            # =============================================
            #  HITUNG DOMAIN — SUPER CEPAT (Single Pass Regex)
            # =============================================
            # Menghitung baris yang BUKAN komentar, BUKAN header, dan BUKAN baris kosong.
            # Dioptimalkan untuk file raksasa (puluhan MB) seperti OISD Big & Steven Black.
            count=$(grep -cE '^[[:space:]]*[^!#[:space:]\[]' "$file" || true)

            count=${count:-0}
            [[ "$count" =~ ^[0-9]+$ ]] || count=0

            total=$((total + count))

            epoch_time=$(stat -c %Y "$file")
            file_time=$(TZ=Asia/Jakarta date -d "@$epoch_time" '+%Y-%m-%d %H:%M WIB' 2>/dev/null || echo "$current_time")
            
            # Format angka dengan pemisah ribuan (misal: 1,234,567) agar mudah dibaca
            count_fmt=$(printf "%'d" "$count")

            link_rawgithack="[RawGitHack]($RAWGITHACK/$file)"
            link_jsdelivr="[jsDelivr]($JSDELIVR/$file)"
            link_raw_github="[GitHub]($RAW_GITHUB/$file)"
            
            # Hapus prefix 'hosts/' agar nama file di tabel lebih rapi
            display_name="${file#hosts/}"

            echo "| \`$display_name\` | $link_rawgithack | $link_jsdelivr | $link_raw_github | $count_fmt | $file_time |" >> README.md
          done < <(find hosts -type f -name "*.txt" | sort)

          total_fmt=$(printf "%'d" "$total")

          echo "" >> README.md
          echo "**Total Domain Terblokir:** $total_fmt" >> README.md
          echo "" >> README.md
          echo "---" >> README.md
          echo "*Terakhir sinkronisasi: $current_time*" >> README.md

      - name: Commit Changes
        run: |
          set -Eeuo pipefail

          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "auto: update hosts $(date +%Y%m%d-%H%M)"
          git push
