name: "Update Hosts Registry"

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/update-hosts.yml"
      # - "sources.list"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup Git"
        shell: bash
        run: |
          set -Eeuo pipefail

          git config --local user.name "RusdiEneri"
          git config --local user.email "nuruddinrusydiilham@gmail.com"
          git config --local pull.rebase true

          git remote set-url origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: "Check Sources"
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "sources.list" ]]; then
            echo "::error::sources.list tidak ditemukan."
            exit 1
          fi

          echo "✅ sources.list ditemukan."
          echo
          echo "Daftar sumber:"
          cat sources.list

      - name: "Fetch Sources"
        shell: bash
        run: |
          set -Eeuo pipefail

          STAGING=".hosts-staging"

          rm -rf "$STAGING"
          mkdir -p "$STAGING/hosts"

          : > "$STAGING/manifest.txt"

          while IFS= read -r line || [[ -n "$line" ]]; do
            # Hilangkan CR dari Windows line ending
            line="${line%$'\r'}"

            # Skip kosong / komentar
            [[ -z "${line//[[:space:]]/}" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            # Ambil path dan URL
            read -r path url extra <<< "$line"

            if [[ -z "${path:-}" || -z "${url:-}" || -n "${extra:-}" ]]; then
              echo "::error::Format sources.list tidak valid:"
              echo "   $line"
              rm -rf "$STAGING"
              exit 1
            fi

            # Mencegah path traversal
            if [[ "$path" == /* || "$path" == *".."* ]]; then
              echo "::error::Path tidak aman: $path"
              rm -rf "$STAGING"
              exit 1
            fi

            dest="$STAGING/hosts/${path}.txt"
            mkdir -p "$(dirname "$dest")"

            echo "========================================"
            echo "Downloading: $path"
            echo "URL:         $url"
            echo "========================================"

            printf 'hosts/%s.txt\n' "$path" >> "$STAGING/manifest.txt"

            if curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --compressed \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 20 \
              --max-time 600 \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" \
              --output "$dest.tmp" \
              "$url"; then

              mv "$dest.tmp" "$dest"
              echo "✅ Download berhasil."

            else
              echo "::error::Download gagal: $url"
              rm -f "$dest.tmp"
              rm -rf "$STAGING"
              exit 1
            fi

          done < sources.list

          echo
          echo "✅ Semua source berhasil di-download."

      - name: "Update Hosts Registry"
        id: hosts
        shell: bash
        run: |
          set -Eeuo pipefail

          STAGING=".hosts-staging"
          CHANGED=0

          mkdir -p hosts

          # ----------------------------------------
          # Tambah / update file
          # ----------------------------------------
          while IFS= read -r staged_file || [[ -n "$staged_file" ]]; do
            [[ -z "$staged_file" ]] && continue

            source_file="$STAGING/$staged_file"
            target_file="$staged_file"

            mkdir -p "$(dirname "$target_file")"

            if [[ -f "$target_file" ]] && cmp -s "$source_file" "$target_file"; then
              echo "UNCHANGED: $target_file"
              rm -f "$source_file"
            else
              echo "UPDATED:   $target_file"
              mv "$source_file" "$target_file"
              CHANGED=1
            fi

          done < "$STAGING/manifest.txt"

          # ----------------------------------------
          # Hapus file lama yang sudah dihapus
          # dari sources.list
          # ----------------------------------------
          while IFS= read -r -d '' existing_file; do
            if ! grep -Fqx -- "$existing_file" "$STAGING/manifest.txt"; then
              echo "REMOVED:   $existing_file"
              rm -f "$existing_file"
              CHANGED=1
            fi
          done < <(find hosts -type f -name "*.txt" -print0)

          # Hapus folder kosong
          find hosts -type d -empty -delete || true

          rm -rf "$STAGING"

          echo

          if [[ "$CHANGED" -eq 1 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Hosts registry berubah."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Tidak ada perubahan pada hosts."
          fi

      - name: "Generate README"
        if: steps.hosts.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          REPO="${{ github.repository }}"

          RAW_GITHUB="https://raw.githubusercontent.com/${REPO}/main"
          JSDELIVR="https://cdn.jsdelivr.net/gh/${REPO}@main"
          RAWGITHACK="https://raw.githack.com/${REPO}/main"

          CURRENT_TIME="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')"

          cat > README.md <<EOF
      # 🛡️ DNS Blocklist Registry
      
      Koleksi daftar hitam domain (hosts/blocklist) terkurasi. Repositori ini menyediakan berbagai daftar dari **HaGeZi, OISD, dan Steven Black** yang siap digunakan untuk aplikasi seperti AdGuard Home, Pi-hole, NextDNS, atau uBlock Origin.
      
      ## 📖 Panduan Memilih Blocklist
      
      ### 1. Pilih SATU Level Utama
      
      - **Light / OISD Small:** Sangat ringan untuk penggunaan dasar.
      - **Multi / OISD Big:** Kombinasi berbagai sumber untuk penggunaan umum.
      - **Pro / Pro Plus:** Pemblokiran lebih agresif.
      - **Ultimate:** Pemblokiran paling ketat dan mungkin membutuhkan whitelist manual.
      
      ### 2. Kategori Khusus
      
      - **NSFW / OISD NSFW:** Memblokir situs dewasa.
      - **Gambling:** Memblokir situs judi online.
      - **Social:** Memblokir media sosial.
      - **Popupads / Fake:** Memblokir iklan pop-up dan situs penipuan.
      
      ### 3. Native / Vendor Tracking
      
      Daftar khusus perangkat atau platform:
      
      - \`native.xiaomi\`
      - \`native.samsung\`
      - \`native.oppo-realme\`
      - \`native.vivo\`
      - \`native.huawei\`
      - \`native.apple\`
      - \`native.winoffice\`
      
      ### 4. Keamanan & Anti-Bypass
      
      - **TIF:** Threat intelligence, malware, dan phishing.
      - **DoH / VPN-Proxy-Bypass:** Daftar untuk membantu mengidentifikasi endpoint bypass DNS.
      
      ---
      
      ## 📊 Statistik & Link Unduh
      
      > 💡 Gunakan **RawGitHack** atau **jsDelivr** untuk penggunaan pada aplikasi pemblokir DNS.
      
      | File | RawGitHack | jsDelivr | GitHub Raw | Jumlah Domain | Terakhir Diupdate |
      |------|------------|----------|------------|---------------|-------------------|
      EOF

          total=0

          while IFS= read -r file; do
            count="$(
              grep -cE '^[[:space:]]*[^!#[:space:]\[]' "$file" || true
            )"

            count="${count:-0}"

            [[ "$count" =~ ^[0-9]+$ ]] || count=0

            total=$((total + count))

            epoch_time="$(stat -c %Y "$file")"

            file_time="$(
              TZ=Asia/Jakarta date \
                -d "@$epoch_time" \
                '+%Y-%m-%d %H:%M WIB' \
                2>/dev/null || echo "$CURRENT_TIME"
            )"

            count_fmt="$(printf "%'d" "$count")"

            display_name="${file#hosts/}"

            link_rawgithack="[RawGitHack]($RAWGITHACK/$file)"
            link_jsdelivr="[jsDelivr]($JSDELIVR/$file)"
            link_raw_github="[GitHub]($RAW_GITHUB/$file)"

            printf \
              '| `%s` | %s | %s | %s | %s | %s |\n' \
              "$display_name" \
              "$link_rawgithack" \
              "$link_jsdelivr" \
              "$link_raw_github" \
              "$count_fmt" \
              "$file_time" \
              >> README.md

          done < <(
            find hosts -type f -name "*.txt" | sort
          )

          total_fmt="$(printf "%'d" "$total")"

          {
            echo
            echo "**Total Domain Terblokir:** $total_fmt"
            echo
            echo "---"
            echo "*Terakhir sinkronisasi: $CURRENT_TIME*"
          } >> README.md

      - name: "Check Git Changes"
        id: git_changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Tidak ada perubahan Git."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📝 Ada perubahan yang akan di-commit."
            echo
            git diff --cached --stat
          fi

      - name: "Configure SSH Signing and Commit"
        if: steps.git_changes.outputs.changed == 'true'
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # ==========================================
          # 1. Validasi secret
          # ==========================================
          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "::error::Secret COMMIT_SIGNING_KEY tidak ditemukan atau kosong."
            exit 1
          fi

          # ==========================================
          # 2. Siapkan direktori key
          # ==========================================
          KEY_DIR="${RUNNER_TEMP}/git-signing"
          PRIVATE_KEY="${KEY_DIR}/signing_key"
          PUBLIC_KEY="${KEY_DIR}/signing_key.pub"
          ALLOWED_SIGNERS="${KEY_DIR}/allowed_signers"

          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"

          # ==========================================
          # 3. Simpan private key
          # ==========================================
          printf '%s\n' "$SIGNING_KEY" > "$PRIVATE_KEY"
          chmod 600 "$PRIVATE_KEY"

          # ==========================================
          # 4. Generate public key
          # ==========================================
          ssh-keygen -y \
            -f "$PRIVATE_KEY" \
            > "$PUBLIC_KEY"

          chmod 644 "$PUBLIC_KEY"

          if [[ ! -s "$PUBLIC_KEY" ]]; then
            echo "::error::Public key gagal dibuat."
            exit 1
          fi

          # ==========================================
          # 5. Start SSH agent
          # ==========================================
          eval "$(ssh-agent -s)"

          ssh-add "$PRIVATE_KEY"

          # ==========================================
          # 6. Git identity
          # ==========================================
          git config --local user.name "RusdiEneri"
          git config --local user.email "nuruddinrusydiilham@gmail.com"

          # ==========================================
          # 7. SSH commit signing
          # ==========================================
          git config --local gpg.format ssh
          git config --local gpg.ssh.program ssh-keygen
          git config --local user.signingkey "$PUBLIC_KEY"
          git config --local commit.gpgsign true

          # ==========================================
          # 8. Allowed signers untuk local verification
          # ==========================================
          printf '%s %s\n' \
            "nuruddinrusydiilham@gmail.com" \
            "$(cat "$PUBLIC_KEY")" \
            > "$ALLOWED_SIGNERS"

          chmod 644 "$ALLOWED_SIGNERS"

          git config --local \
            gpg.ssh.allowedSignersFile "$ALLOWED_SIGNERS"

          echo "✅ SSH signing key berhasil disiapkan."

          # ==========================================
          # 9. Buat signed commit
          # ==========================================
          git commit -S \
            -m "auto: update hosts $(TZ=Asia/Jakarta date '+%Y%m%d-%H%M')"

          echo
          echo "✅ Commit signed berhasil dibuat."

          # ==========================================
          # 10. Verifikasi signature secara lokal
          # ==========================================
          echo
          echo "🔏 Verifying commit signature..."

          git verify-commit HEAD

          echo
          echo "✅ Signature valid."

      - name: "Push Changes"
        if: steps.git_changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in 1 2 3 4 5; do
            echo "========================================"
            echo "🚀 Push attempt $attempt/5"
            echo "========================================"

            # Coba push langsung terlebih dahulu.
            if git push origin HEAD:main; then
              echo "✅ Push berhasil."
              exit 0
            fi

            echo "⚠️ Push ditolak. Remote mungkin berubah."

            if [[ "$attempt" -eq 5 ]]; then
              break
            fi

            echo "🔄 Fetch origin/main..."
            git fetch origin main

            echo "🔄 Rebase dengan SSH signature..."
            git rebase --gpg-sign origin/main

            echo "✅ Rebase selesai dan commit ditandatangani ulang."

            echo
            echo "🔏 Verifikasi signature setelah rebase..."
            git verify-commit HEAD

            echo
            echo "⏳ Menunggu 5 detik sebelum mencoba lagi..."
            sleep 5
          done

          echo "::error::Push gagal setelah 5 percobaan."
          exit 1

      - name: "No Changes"
        if: steps.git_changes.outputs.changed == 'false'
        shell: bash
        run: |
          echo "✅ Semua blocklist masih sama."
          echo "Tidak membuat commit baru."
