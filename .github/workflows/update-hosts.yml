name: Update DNS Blocklist Registry

on:
  # Jalankan setiap 6 jam (cron menggunakan UTC).
  schedule:
    - cron: "23 */6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-hosts.yml"
      - "sources.md"

permissions:
  contents: write

concurrency:
  group: update-dns-blocklist-registry-main
  cancel-in-progress: false

jobs:
  update:
    name: Fetch, validate, and publish blocklists
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Validate and fetch sources
        id: fetch
        env:
          SOURCE_FILE: sources.md
          STAGING_DIR: ${{ runner.temp }}/hosts-staging
        run: |
          set -Eeuo pipefail

          if [[ ! -f "$SOURCE_FILE" ]]; then
            echo "::error::$SOURCE_FILE tidak ditemukan."
            exit 1
          fi

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR/hosts"
          : > "$STAGING_DIR/manifest.txt"

          declare -A SEEN_PATHS=()
          source_count=0

          echo "Sumber yang akan diproses: $SOURCE_FILE"
          cat "$SOURCE_FILE"
          echo

          while IFS= read -r line || [[ -n "$line" ]]; do
            # Mendukung line ending Windows, baris kosong, dan komentar Markdown.
            line="${line%$'\r'}"
            [[ -z "${line//[[:space:]]/}" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            read -r path url extra <<< "$line"

            if [[ -z "${path:-}" || -z "${url:-}" || -n "${extra:-}" ]]; then
              echo "::error::Format sumber tidak valid: $line"
              exit 1
            fi

            # Hanya path relatif sederhana dan URL HTTPS yang diperbolehkan.
            if [[ ! "$path" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ || "$path" == *".."* || "$path" == *"//"* ]]; then
              echo "::error::Path sumber tidak aman: $path"
              exit 1
            fi

            if [[ "$url" != https://* ]]; then
              echo "::error::Sumber harus menggunakan HTTPS: $url"
              exit 1
            fi

            if [[ -n "${SEEN_PATHS[$path]+x}" ]]; then
              echo "::error::Path sumber duplikat: $path"
              exit 1
            fi
            SEEN_PATHS["$path"]=1

            dest="$STAGING_DIR/hosts/${path}.txt"
            mkdir -p "$(dirname "$dest")"

            echo "========================================"
            echo "Mengunduh: $path"
            echo "URL:       $url"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --compressed \
              --retry 3 \
              --retry-delay 2 \
              --retry-connrefused \
              --connect-timeout 15 \
              --max-time 300 \
              --user-agent "DNS-Blocklist-Registry/1.0 (+https://github.com/${GITHUB_REPOSITORY:-RusdiEneri/blacklist-hosts})" \
              --output "$dest.tmp" \
              "$url"

            if [[ ! -s "$dest.tmp" ]]; then
              echo "::error::Sumber kosong: $url"
              exit 1
            fi

            size_bytes="$(wc -c < "$dest.tmp")"
            if (( size_bytes < 64 )); then
              echo "::error::File terlalu kecil untuk dianggap blocklist valid ($size_bytes bytes): $url"
              exit 1
            fi

            if head -c 4096 "$dest.tmp" | grep -Eiq '<!doctype[[:space:]]+html|<html([[:space:]>])|<head([[:space:]>])'; then
              echo "::error::Sumber mengembalikan HTML, bukan blocklist: $url"
              exit 1
            fi

            # Validasi format konten: Adblock vs hosts syntax
            if [[ "$path" == HaGeZi/* || "$url" == */adblock/* ]]; then
              if ! grep -qE '^[[:space:]]*\|\|[a-zA-Z0-9_.-]+\^' "$dest.tmp" && ! grep -qi '^\[Adblock' "$dest.tmp"; then
                echo "::error::Format Adblock tidak valid untuk sumber: $url"
                exit 1
              fi
            elif [[ "$path" == StevenBlack/* || "$url" == */hosts || "$url" == */hosts/* ]]; then
              if ! grep -qE '^[[:space:]]*(0\.0\.0\.0|127\.0\.0\.1)[[:space:]]+[a-zA-Z0-9_.-]+' "$dest.tmp"; then
                echo "::error::Format hosts tidak valid untuk sumber: $url"
                exit 1
              fi
            else
              if ! grep -qE '^[[:space:]]*\|\|[a-zA-Z0-9_.-]+\^' "$dest.tmp" && \
                 ! grep -qE '^[[:space:]]*(0\.0\.0\.0|127\.0\.0\.1)[[:space:]]+[a-zA-Z0-9_.-]+' "$dest.tmp"; then
                echo "::error::Format blocklist tidak dikenal (bukan Adblock maupun hosts format): $url"
                exit 1
              fi
            fi

            entry_count="$(grep -cE '^[[:space:]]*[^!#[:space:]\[]' "$dest.tmp" || true)"
            entry_count="${entry_count:-0}"
            if [[ ! "$entry_count" =~ ^[0-9]+$ ]] || (( entry_count < 1 )); then
              echo "::error::Tidak ditemukan entri aturan yang valid: $url"
              exit 1
            fi

            mv "$dest.tmp" "$dest"
            printf 'hosts/%s.txt\n' "$path" >> "$STAGING_DIR/manifest.txt"
            source_count=$((source_count + 1))
            echo "Valid: ${entry_count} entri, ${size_bytes} bytes"
          done < "$SOURCE_FILE"

          if (( source_count == 0 )); then
            echo "::error::Tidak ada sumber yang valid di $SOURCE_FILE."
            exit 1
          fi

          echo "source_count=$source_count" >> "$GITHUB_OUTPUT"
          echo "Berhasil mengunduh dan memvalidasi $source_count sumber."

      - name: Update registry files
        id: hosts
        env:
          STAGING_DIR: ${{ runner.temp }}/hosts-staging
        run: |
          set -Eeuo pipefail

          manifest="$STAGING_DIR/manifest.txt"
          changed=0
          updated=0
          removed=0

          mkdir -p hosts

          # Salin hanya jika isi berubah untuk menghindari commit yang tidak perlu.
          while IFS= read -r staged_file || [[ -n "$staged_file" ]]; do
            [[ -z "$staged_file" ]] && continue

            source_file="$STAGING_DIR/$staged_file"
            target_file="$staged_file"
            mkdir -p "$(dirname "$target_file")"

            if [[ -f "$target_file" ]] && cmp -s "$source_file" "$target_file"; then
              echo "UNCHANGED: $target_file"
              rm -f "$source_file"
            else
              echo "UPDATED:   $target_file"
              target_tmp="${target_file}.tmp.$$"
              cp "$source_file" "$target_tmp"
              mv -f "$target_tmp" "$target_file"
              rm -f "$source_file"
              changed=1
              updated=$((updated + 1))
            fi
          done < "$manifest"

          # Hapus hanya file .txt dalam direktori hosts/ yang tidak lagi terdaftar.
          while IFS= read -r -d '' existing_file; do
            if ! grep -Fqx -- "$existing_file" "$manifest"; then
              echo "REMOVED:   $existing_file"
              rm -f -- "$existing_file"
              changed=1
              removed=$((removed + 1))
            fi
          done < <(find hosts -type f -name '*.txt' -print0)

          find hosts -depth -type d -empty -delete
          rm -rf "$STAGING_DIR"

          echo "changed=$([[ "$changed" -eq 1 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "updated=$updated" >> "$GITHUB_OUTPUT"
          echo "removed=$removed" >> "$GITHUB_OUTPUT"
          echo "File diperbarui: $updated; file dihapus: $removed"

      - name: Generate README
        env:
          REPO: ${{ github.repository }}
          REGISTRY_CHANGED: ${{ steps.hosts.outputs.changed }}
        run: |
          set -Eeuo pipefail

          BRANCH="${GITHUB_REF_NAME:-main}"
          REPO_NAME="${REPO:-RusdiEneri/blacklist-hosts}"
          RAW_GITHUB="https://raw.githubusercontent.com/${REPO_NAME}/${BRANCH}"
          JSDELIVR="https://cdn.jsdelivr.net/gh/${REPO_NAME}@${BRANCH}"
          RAWGITHACK="https://raw.githack.com/${REPO_NAME}/${BRANCH}"
          CURRENT_TIME="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')"

          format_num() {
            local val="$1"
            if command -v python3 >/dev/null 2>&1; then
              python3 -c 'import sys; print(f"{int(sys.argv[1]):,}")' "$val"
            elif command -v python >/dev/null 2>&1; then
              python -c 'import sys; print(f"{int(sys.argv[1]):,}")' "$val"
            else
              printf "%'d\n" "$val" 2>/dev/null || echo "$val"
            fi
          }

          # Pertahankan waktu sinkronisasi saat isi blocklist tidak berubah.
          PREVIOUS_SYNC=""
          if [[ -f README.md ]]; then
            PREVIOUS_SYNC="$(sed -nE 's/^\*(Sinkronisasi konten terakhir|Terakhir sinkronisasi): (.*)\*$/\2/p' README.md | head -n 1 || true)"
          fi

          if [[ "$REGISTRY_CHANGED" == "true" || -z "$PREVIOUS_SYNC" ]]; then
            SYNC_TIME="$CURRENT_TIME"
          else
            SYNC_TIME="$PREVIOUS_SYNC"
          fi

          {
            echo "# 🛡️ DNS Blocklist Registry"
            echo
            echo "Koleksi blocklist DNS terkurasi untuk **AdGuard Home, Pi-hole, dan resolver pemblokir DNS lainnya**. Berkas di repositori ini disinkronkan otomatis dari sumber upstream dan disediakan melalui GitHub Raw, jsDelivr, serta RawGitHack."
            echo
            echo "> **Catatan:** pilih daftar sesuai kebutuhan. Mengaktifkan beberapa daftar dengan cakupan serupa dapat menambah duplikasi dan risiko false positive. HaGeZi Multi PRO++ bersifat lebih agresif; uji kompatibilitas perangkat dan situs yang biasa digunakan."
            echo
            echo "## Daftar Blocklist"
            echo
            echo "| Daftar | Kegunaan | RawGitHack | jsDelivr | GitHub Raw | Jumlah entri* |"
            echo "|---|---|---|---|---|---:|"
          } > README.md

          total=0
          file_count=0

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            count="$(grep -cE '^[[:space:]]*[^!#[:space:]\[]' "$file" || true)"
            count="${count:-0}"
            [[ "$count" =~ ^[0-9]+$ ]] || count=0
            total=$((total + count))
            file_count=$((file_count + 1))

            case "$file" in
              "hosts/HaGeZi/nsfw.txt")
                name="HaGeZi NSFW"
                purpose="Memblokir konten dewasa" ;;
              "hosts/HaGeZi/tif.medium.txt")
                name="HaGeZi Threat Intelligence Feeds — Medium"
                purpose="Daftar threat intelligence versi medium" ;;
              "hosts/HaGeZi/gambling.txt")
                name="HaGeZi Gambling"
                purpose="Memblokir konten perjudian" ;;
              "hosts/HaGeZi/pro.plus.txt")
                name="HaGeZi Multi PRO++"
                purpose="Perlindungan umum yang lebih agresif" ;;
              "hosts/StevenBlack/fakenews.txt")
                name="StevenBlack Fake News & Misinformation"
                purpose="Memblokir sumber fake news dan misinformasi" ;;
              *)
                name="${file#hosts/}"
                purpose="Blocklist tambahan dari sources.md" ;;
            esac

            count_fmt="$(format_num "$count")"
            printf '| **%s** | %s | [RawGitHack](%s/%s) | [jsDelivr](%s/%s) | [GitHub](%s/%s) | %s |\n' \
              "$name" "$purpose" "$RAWGITHACK" "$file" "$JSDELIVR" "$file" "$RAW_GITHUB" "$file" "$count_fmt" \
              >> README.md
          done < <(find hosts -type f -name '*.txt' -print | sort)

          total_fmt="$(format_num "$total")"

          {
            echo
            echo "**Jumlah file:** $file_count"
            echo
            echo "**Total entri lintas daftar:** $total_fmt"
            echo
            echo "<sub>*Jumlah entri dihitung dari baris aturan nonkosong yang bukan komentar/header. Total ini bukan jumlah domain unik; duplikasi antar-daftar dapat terjadi.</sub>"
            echo
            echo "---"
            echo "*Sinkronisasi konten terakhir: $SYNC_TIME*"
            echo
            echo "Sumber dan URL upstream dikelola melalui [\`sources.md\`](sources.md)."
          } >> README.md

          echo "README dibuat untuk $file_count file; total baris aturan terdeteksi: $total_fmt."

      - name: Check Git changes
        id: git_changes
        run: |
          set -Eeuo pipefail
          git add -A -- README.md hosts

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tidak ada perubahan yang perlu di-commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Perubahan yang akan di-commit:"
            git diff --cached --stat
          fi

      - name: Sign, commit, and push
        if: steps.git_changes.outputs.changed == 'true'
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "::error::Secret COMMIT_SIGNING_KEY tidak ditemukan atau kosong."
            exit 1
          fi

          KEY_DIR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/git-signing"
          PRIVATE_KEY="$KEY_DIR/signing_key"
          PUBLIC_KEY="$KEY_DIR/signing_key.pub"
          ALLOWED_SIGNERS="$KEY_DIR/allowed_signers"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf "$KEY_DIR"' EXIT

          printf '%s\n' "$SIGNING_KEY" | tr -d '\r' > "$PRIVATE_KEY"
          chmod 600 "$PRIVATE_KEY"

          if ! ssh-keygen -y -P "" -f "$PRIVATE_KEY" > "$PUBLIC_KEY"; then
            echo "::error::COMMIT_SIGNING_KEY tidak valid atau menggunakan passphrase yang belum didukung workflow ini."
            exit 1
          fi
          chmod 644 "$PUBLIC_KEY"

          eval "$(ssh-agent -s)" >/dev/null
          ssh-add "$PRIVATE_KEY" >/dev/null

          git config --local user.name "RusdiEneri"
          git config --local user.email "nuruddinrusydiilham@gmail.com"
          git config --local gpg.format ssh
          git config --local gpg.ssh.program ssh-keygen
          git config --local user.signingkey "$PUBLIC_KEY"
          git config --local commit.gpgsign true

          printf '%s %s\n' "nuruddinrusydiilham@gmail.com" "$(cat "$PUBLIC_KEY")" > "$ALLOWED_SIGNERS"
          chmod 644 "$ALLOWED_SIGNERS"
          git config --local gpg.ssh.allowedSignersFile "$ALLOWED_SIGNERS"

          git commit -S -m "chore: update DNS blocklists $(TZ=Asia/Jakarta date '+%Y%m%d-%H%M')"
          git verify-commit HEAD

          # Agent tetap hidup di step ini, sehingga rebase juga dapat ditandatangani.
          for attempt in 1 2 3 4 5; do
            echo "Push percobaan $attempt/5..."
            if git push origin HEAD:main; then
              echo "Push berhasil."
              exit 0
            fi

            if [[ "$attempt" -eq 5 ]]; then
              break
            fi

            echo "Push ditolak/gagal; mengambil main terbaru lalu mencoba rebase."
            git fetch origin main
            if ! git rebase -S origin/main; then
              git rebase --abort || true
              echo "::error::Rebase gagal, kemungkinan ada konflik dengan perubahan terbaru di main."
              exit 1
            fi
            git verify-commit HEAD
            sleep 3
          done

          echo "::error::Push gagal setelah 5 percobaan."
          exit 1

      - name: No changes
        if: steps.git_changes.outputs.changed == 'false'
        run: |
          echo "Semua blocklist dan README masih sama; tidak membuat commit baru."
